services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    network_mode: host   # simplest option for DLNA/discovery on a Pi; see README for the alternative
    volumes:
      - ./config/jellyfin/config:/config
      - ./config/jellyfin/cache:/cache
      - ${MEDIA_PATH}:/media
    restart: unless-stopped

  couchdb:
    image: couchdb:3
    container_name: obsidian-livesync-couchdb
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    volumes:
      - ./config/couchdb/data:/opt/couchdb/data
      - ./config/couchdb/local.ini:/opt/couchdb/etc/local.d/local.ini
    restart: unless-stopped

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: ${BESZEL_APP_URL:-http://localhost:8090}
    ports:
      - "8090:8090"
    volumes:
      - ./config/beszel/beszel_data:/beszel_data
      - ./config/beszel/beszel_socket:/beszel_socket

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host   # needed to read real host interface/disk stats
    depends_on:
      - beszel
    volumes:
      - ./config/beszel/beszel_agent_data:/var/lib/beszel-agent
      - ./config/beszel/beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: ${BESZEL_APP_URL:-http://localhost:8090}
      TOKEN: ${BESZEL_TOKEN:-}
      KEY: ${BESZEL_KEY:-}