services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    network_mode: host   # simplest option for DLNA/discovery on a Pi; see README for the alternative
    volumes:
      - ./config/jellyfin/config:/config
      - ./config/jellyfin/cache:/cache
      - ${MEDIA_PATH}:/media
    restart: unless-stopped

  couchdb:
    image: couchdb:3
    container_name: obsidian-livesync-couchdb
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    volumes:
      - ./config/couchdb/data:/opt/couchdb/data
      - ./config/couchdb/local.ini:/opt/couchdb/etc/local.d/local.ini
    restart: unless-stopped

  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    pid: host
    privileged: true
    network_mode: host   # so it reports real host network stats, not just the docker bridge
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  dns:
    image: dockurr/dnsmasq
    container_name: homelab-dns
    restart: unless-stopped
    network_mode: host   # binds :53 on all interfaces, including the tailscale0 one
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./config/dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    network_mode: host   # so it can reach jellyfin/couchdb via localhost, and bind :80 directly
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/caddy/data:/data
      - ./config/caddy/config:/config